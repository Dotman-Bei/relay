[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read", path = "./out" }]

[fuzz]
runs = 1024
seed = "0x52454c4159"

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1000
depth = 128

[fmt]
line_length = 120
