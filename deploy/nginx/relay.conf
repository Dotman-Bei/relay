# Relay — BOT Chain testnet (PROJECT_BASELINE). Three names on this VPS's IP via sslip.io; swap for a real
# domain with: edit server_name, certbot --nginx, then pnpm endpoints:set. HTTP only until certbot adds TLS.
#
# Remove with:  rm /etc/nginx/sites-enabled/relay && nginx -s reload
server {
    server_name relay.169-58-153-9.sslip.io;
    location / {
        proxy_pass http://127.0.0.1:3710;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    listen 80;
    listen [::]:80;
}

server {
    server_name storage.relay.169-58-153-9.sslip.io;
    # Encrypted contribution uploads; the storage server itself caps blobs at 64 MB.
    client_max_body_size 65m;
    location / {
        proxy_pass http://127.0.0.1:8697;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    listen 80;
    listen [::]:80;
}

server {
    server_name steward.relay.169-58-153-9.sslip.io;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:8698;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    listen 80;
    listen [::]:80;
}
