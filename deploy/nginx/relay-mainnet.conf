# Relay mainnet storage beside the testnet sites (docs/runbooks/mainnet-deploy.md). HTTP only until
# `certbot --nginx -d <name> --cert-name relay-mainnet` adds TLS; then `pnpm endpoints:set` for mainnet.
server {
    server_name storage-mainnet.relay.169-58-153-9.sslip.io;
    # Encrypted contribution uploads; the storage server itself caps blobs at 64 MB.
    client_max_body_size 65m;
    location / {
        proxy_pass http://127.0.0.1:8707;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    listen 80;
    listen [::]:80;
}
